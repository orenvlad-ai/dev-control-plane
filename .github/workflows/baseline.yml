name: Baseline

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: baseline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    name: baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate minimal planning surface
        shell: bash
        run: |
          set -euo pipefail

          required=(
            AGENTS.md
            README.md
            docs/PROJECT_BRIEF.md
            docs/ROADMAP.md
            docs/DECISIONS.md
          )
          for file in "${required[@]}"; do
            test -s "$file"
          done

          retired=(
            apps
            artifacts
            configs
            deploy
            dev_control_plane_docs_master
            src
          )
          for path in "${retired[@]}"; do
            test ! -e "$path"
          done

          test "$(find . -type f -name '*.py' -not -path './.git/*' | wc -l)" -eq 0
          grep -Fq 'archive/legacy-v1-v2-20260807' README.md
          grep -Fq 'No Agent Orchestrator' docs/DECISIONS.md
          git diff --check
