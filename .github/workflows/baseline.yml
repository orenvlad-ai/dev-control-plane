name: Baseline

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: baseline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    name: baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate I12 managed fork and reviewer boundary
        shell: bash
        env:
          DCP_AO_CONTRACT_BASE: ${{ github.event.pull_request.base.sha }}
        run: ./scripts/i12_audit.sh
      - name: Validate I9 target documentation contract
        shell: bash
        run: ./scripts/i9_contract_audit.sh
      - name: Validate I27 wb-core Release Train handoff contract
        shell: bash
        run: ./scripts/i27_wb_core_contract_audit.sh
