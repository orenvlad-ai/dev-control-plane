name: Baseline

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: baseline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    name: baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate I12 managed fork and reviewer boundary
        shell: bash
        env:
          DCP_AO_CONTRACT_BASE: ${{ github.event.pull_request.base.sha }}
        run: ./scripts/i12_audit.sh
      - name: Validate I9 target documentation contract
        shell: bash
        run: ./scripts/i9_contract_audit.sh
      - name: Validate I27 wb-core Release Train handoff contract
        shell: bash
        run: ./scripts/i27_wb_core_contract_audit.sh
      - name: Validate I27 wb-core immutable pin and adapter lock
        shell: bash
        run: ./scripts/i27_wb_core_install_audit.sh
      - name: Validate I27 WBC CI truth and lifecycle UX contract
        shell: bash
        run: ./scripts/i27_wbc_ci_lifecycle_contract_audit.sh
      - name: Validate I27 WBC full release/deploy path contract
        shell: bash
        run: ./scripts/i27_wbc_full_path_contract_audit.sh
      - name: Validate I28 task-first native lifecycle contract
        shell: bash
        run: ./scripts/i28_task_first_lifecycle_contract_audit.sh
      - name: Validate I30 WBC integration twin and DCP v2 architecture contract
        shell: bash
        run: ./scripts/i30_wbc_integration_twin_dcp_v2_contract_audit.sh
