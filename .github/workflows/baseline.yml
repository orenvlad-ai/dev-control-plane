name: Baseline

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: baseline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    name: baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate I12 managed fork and reviewer boundary
        shell: bash
        env:
          DCP_AO_CONTRACT_BASE: ${{ github.event.pull_request.base.sha }}
        run: ./scripts/i12_audit.sh
      - name: Validate I9 target documentation contract
        shell: bash
        run: ./scripts/i9_contract_audit.sh
      - name: Validate I27 wb-core Release Train handoff contract
        shell: bash
        run: ./scripts/i27_wb_core_contract_audit.sh
      - name: Validate I27 wb-core immutable pin and adapter lock
        shell: bash
        run: ./scripts/i27_wb_core_install_audit.sh
      - name: Validate I27 WBC CI truth and lifecycle UX contract
        shell: bash
        run: ./scripts/i27_wbc_ci_lifecycle_contract_audit.sh
      - name: Validate I27 WBC full release/deploy path contract
        shell: bash
        run: ./scripts/i27_wbc_full_path_contract_audit.sh
      - name: Validate I28 task-first native lifecycle contract
        shell: bash
        run: ./scripts/i28_task_first_lifecycle_contract_audit.sh
      - name: Validate I30 WBC integration twin and DCP v2 architecture contract
        shell: bash
        run: ./scripts/i30_wbc_integration_twin_dcp_v2_contract_audit.sh
      - name: Validate I31 Stage 2 Selectel persistent-cell contract
        shell: bash
        run: ./scripts/i31_wbc_integration_twin_stage2_selectel_contract_audit.sh
      - name: Validate I32 Stage 2 closure and Stage 3-4 authority
        shell: bash
        run: ./scripts/i32_wbc_integration_twin_stage2_stage4_audit.sh
      - name: Validate I33 Stage 3 terminal and Stage 4 activation
        shell: bash
        run: ./scripts/i33_wbc_integration_twin_stage3_audit.sh
      - name: Validate I34 Stage 4 source completion
        shell: bash
        run: ./scripts/i34_wbc_integration_twin_stage4_source_audit.sh
      - name: Validate I35 Stage 5 install and activation authority
        shell: bash
        run: ./scripts/i35_wbc_integration_twin_stage5_authority_audit.sh
      - name: Validate I36 Stage 5 exact source pin and stopped install guard
        shell: bash
        run: ./scripts/i36_wbc_integration_twin_stage5_install_audit.sh
      - name: Validate I37 Stage 5 assertion-recovery authority
        shell: bash
        run: ./scripts/i37_wbc_integration_twin_stage5_assertion_authority_audit.sh
      - name: Validate I38 Stage 5 lower-camel activation parser
        shell: bash
        run: ./scripts/i38_wbc_integration_twin_stage5_lower_camel_audit.sh
      - name: Validate I39 Stage 5 terminal evidence
        shell: bash
        run: ./scripts/i39_wbc_integration_twin_stage5_terminal_audit.sh
      - name: Validate I40 Stage 6 post-submit correction authority
        shell: bash
        run: ./scripts/i40_wbc_integration_twin_stage6_correction_audit.sh
      - name: Validate I41 Stage 6 exact recovery pin and stopped install guard
        shell: bash
        run: ./scripts/i41_wbc_integration_twin_stage6_recovery_install_audit.sh
      - name: Validate I42 current program manifest and rotation entry
        shell: bash
        run: ./scripts/i42_wbc_integration_twin_current_manifest_audit.sh
      - name: Validate I43 Stage 6 aggregate install authority
        shell: bash
        run: ./scripts/i43_wbc_integration_twin_stage6_aggregate_install_audit.sh
      - name: Validate I44 Stage 6 aggregate terminal evidence
        shell: bash
        run: ./scripts/i44_wbc_integration_twin_stage6_aggregate_terminal_audit.sh
      - name: Validate I45 Stage 6 direct DCP-v2 model authority
        shell: bash
        run: ./scripts/i45_wbc_integration_twin_direct_model_authority_audit.sh
      - name: Validate I46 Stage 6 direct-model source completion
        shell: bash
        run: ./scripts/i46_wbc_integration_twin_direct_model_source_audit.sh
      - name: Validate I47 Stage 6 direct-model stable-source install authority
        shell: bash
        run: ./scripts/i47_wbc_integration_twin_stage6_direct_install_audit.sh
      - name: Validate I48 Stage 6 direct-model stopped install evidence
        shell: bash
        run: ./scripts/i48_wbc_integration_twin_stage6_direct_install_terminal_audit.sh
      - name: Validate I49 Stage 6 same-identity adoption blocked evidence
        shell: bash
        run: ./scripts/i49_wbc_integration_twin_stage6_adoption_blocked_audit.sh
