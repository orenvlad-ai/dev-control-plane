name: Orchestrator v2

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: orchestrator-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  v2-suite:
    name: v2-suite
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install smoke prerequisites
        run: sudo apt-get update && sudo apt-get install -y ripgrep jq rsync
      - name: Diff integrity
        env:
          PR_BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$PR_BASE_REF" ]; then
            git diff --check "origin/$PR_BASE_REF"...HEAD
          else
            git diff --check HEAD^ HEAD
          fi
      - name: Authoritative v2 suite
        run: |
          set -o pipefail
          python3 apps/dev_control_plane_v2_suite.py | tee /tmp/dev-control-plane-v2-suite.log
          tail -n 1 /tmp/dev-control-plane-v2-suite.log > /tmp/dev-control-plane-v2-suite-evidence.json
      - name: Publish head-bound suite evidence
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v2-suite-evidence-${{ github.event.pull_request.head.sha }}
          path: /tmp/dev-control-plane-v2-suite-evidence.json
          if-no-files-found: error
          retention-days: 1

  self-closure:
    name: self-closure
    if: github.event_name == 'pull_request'
    needs: v2-suite
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Download exact suite evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: v2-suite-evidence-${{ github.event.pull_request.head.sha }}
          path: /tmp/dev-control-plane-self-closure
      - name: Repository-owned self-closure decision
        run: >-
          python3 apps/dev_control_plane_self_closure_v2.py
          --suite-evidence /tmp/dev-control-plane-self-closure/dev-control-plane-v2-suite-evidence.json
